<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planeta Azul · Microred educativa</title>
<meta name="description" content="Planeta Azul: microred social educativa con Director Agente, enjambre de gemelos digitales y anfitriones IA. HTML portable con Gemini, OpenAI y DeepSeek.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232EE6C9'/%3E%3Cstop offset='.5' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%23C15CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='20' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='9' fill='none' stroke='%23C6F432' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#140B2E; --bg2:#1D1042; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.095); --solid:#1E1240; --solid2:#281852;
  --line:rgba(200,160,255,.16); --line2:rgba(200,160,255,.28);
  --text:#FFF8FD; --muted:#C3B6E4; --dim:#8C7FB8;
  --blue:#7C5CFF; --cyan:#2EE6C9; --violet:#C15CFF; --pink:#FF4FA3; --lime:#C6F432; --amber:#FFC93C; --red:#FF6B6B; --green:#2EE59D;
  --grad:linear-gradient(135deg,#FF7A59 0%,#FF4FA3 45%,#7C5CFF 100%);
  --grad2:linear-gradient(135deg,#FFC93C 0%,#FF4FA3 100%);
  --grad3:linear-gradient(135deg,#C6F432 0%,#2EE6C9 100%);
  --r:22px; --r2:16px; --shadow:0 12px 40px rgba(0,0,0,.38);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FFF6FA; --bg2:#F5EDFF; --surface:#FFFFFF; --surface2:#F6EEFF; --solid:#FFFFFF; --solid2:#FBF6FF;
  --line:rgba(110,50,170,.13); --line2:rgba(110,50,170,.26);
  --text:#1F1236; --muted:#5E4C85; --dim:#9486B5; --shadow:0 10px 30px rgba(110,50,170,.12);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 600px at 85% -10%,rgba(124,92,255,.20),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(193,92,255,.18),transparent 60%),radial-gradient(700px 420px at 40% 45%,rgba(255,122,89,.10),transparent 70%),var(--bg)}
:root[data-theme="dark"] body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe1ff,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 320px 40px,#b9c8ff,transparent),radial-gradient(1px 1px at 400px 210px,#fff,transparent);background-size:460px 260px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--cyan)}
::selection{background:rgba(124,92,255,.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.01em;line-height:1.2}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;max-width:1440px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.main{min-width:0;padding:0 24px 120px}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
@media (max-width:1240px){.app{grid-template-columns:230px minmax(0,1fr)}.rail{display:none}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:0 16px 120px}}

.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:var(--display);font-size:21px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.logo{width:40px;height:40px;flex:none}
.logo .ring{transform-origin:50% 50%;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--muted);font-weight:600;font-size:14.5px;text-align:left;width:100%;transition:.18s}
.navbtn .ic{width:24px;text-align:center;font-size:18px}
.navbtn:hover{background:var(--surface);color:var(--text)}
.navbtn.on{background:var(--surface2);color:var(--text);box-shadow:inset 3px 0 0 var(--pink)}
.navbtn .pill{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--grad);color:#fff}
.side .spacer{flex:1}
.side .cta{margin:10px 4px}
.navsep{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:14px 12px 4px;font-weight:700}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:16px 0 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -24px;padding-left:24px;padding-right:24px}
@media (max-width:860px){.topbar{margin:0 -16px;padding-left:16px;padding-right:16px}}
.topbar h1{font-size:24px}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .grow{flex:1;min-width:0}
.mobile-brand{display:none}
@media (max-width:860px){.mobile-brand{display:flex;align-items:center;gap:8px}.topbar h1{font-size:19px}}

.bottomnav{display:none}
@media (max-width:860px){
  .bottomnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:60;justify-content:space-around;padding:8px 6px;border-radius:22px;background:color-mix(in srgb,var(--solid) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted);gap:1px;padding:4px 6px;border-radius:12px;font-weight:600}
  .bottomnav button span{font-size:19px}
  .bottomnav button.on{color:var(--text);background:var(--surface2)}
}

/* ===== Common ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line);transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 22px rgba(255,79,163,.35)}
.btn.pink{background:var(--grad2);border:0;color:#fff}
.btn.lime{background:var(--grad3);border:0;color:#062016}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:11px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:17px}
.iconbtn:hover{background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
:root[data-theme="light"] .card, :root[data-theme="light"] .post{box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.15s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--line2);transform:translateY(-1px) rotate(-1deg)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.tag{color:var(--cyan);font-weight:600;cursor:pointer}
.tag:hover{text-decoration:underline}
.tag.bad{color:var(--amber)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sectitle{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:17px}
.sectitle .line{flex:1;height:1px;background:var(--line)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.twin{background:rgba(198,244,50,.12);color:var(--lime);border-color:rgba(198,244,50,.3)}
.badge.host{background:rgba(46,230,201,.12);color:var(--cyan);border-color:rgba(46,230,201,.3)}
.badge.doc{background:rgba(255,201,60,.12);color:var(--amber);border-color:rgba(255,201,60,.3)}
.badge.amb{background:rgba(255,79,163,.12);color:var(--pink);border-color:rgba(255,79,163,.3)}
.badge.ver{background:rgba(124,92,255,.15);color:#8FB0FF;border-color:rgba(124,92,255,.35)}
.badge.dir{background:rgba(193,92,255,.15);color:#C4B5FD;border-color:rgba(193,92,255,.35)}
:root[data-theme="light"] .badge.ver{color:#2F5BE0} :root[data-theme="light"] .badge.dir{color:#6D3FE0} :root[data-theme="light"] .badge.twin{color:#4D7C0F} :root[data-theme="light"] .badge.host{color:#0E7490} :root[data-theme="light"] .badge.doc{color:#B45309}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;position:relative}
.av.sm{width:32px;height:32px;font-size:12px}
.av.xs{width:26px;height:26px;font-size:11px}
.av.lg{width:92px;height:92px;font-size:32px}
.av.emo{font-size:20px}
.av.sm.emo{font-size:16px}
.av.xs.emo{font-size:13px}
.av.lg.emo{font-size:44px}
input.in,select.in,textarea.in{width:100%;padding:11px 13px;border-radius:13px;background:var(--surface);border:1px solid var(--line);outline:none;transition:.15s}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
select.in option{background:var(--solid);color:var(--text)}
textarea.in{resize:vertical;min-height:80px}
label.lb{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.switch{position:relative;width:44px;height:26px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--grad);border-color:transparent}
.switch.on::after{left:21px;background:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
pre.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--solid2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-all}

/* ===== Stories ===== */
.stories{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
.story .ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#2EE6C9,#7C5CFF,#C15CFF,#FF4FA3,#2EE6C9)}
.story.seen .ring{background:var(--line2)}
.story .ring .av{width:100%;height:100%;border:3px solid var(--bg)}
.story .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.story.add .ring{background:var(--surface2);border:2px dashed var(--line2);display:grid;place-items:center;font-size:26px;color:var(--cyan)}

/* ===== Level bar ===== */
.levelbar{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.levelbar::-webkit-scrollbar{display:none}
.levelbar select.in{width:auto;padding:6px 10px;font-size:13px;border-radius:99px}
.filterpill{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 12px;border-radius:14px;background:rgba(46,230,201,.08);border:1px solid rgba(46,230,201,.25);font-size:13px}

/* ===== Composer mini ===== */
.composer{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.composer .fake{flex:1;padding:11px 14px;border-radius:14px;background:var(--surface2);color:var(--muted);text-align:left;font-size:14px}
.composer .kinds{display:flex;gap:6px}
@media (max-width:620px){.composer{flex-wrap:wrap}.composer .kinds{width:100%;justify-content:space-between}}

/* ===== Post ===== */
.post{background:var(--surface);border:1px solid var(--line);border-radius:24px;margin-bottom:18px;overflow:hidden;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.post.hot{box-shadow:0 0 0 2px rgba(198,244,50,.35)}
.post-h{display:flex;gap:11px;align-items:center;padding:14px 16px 10px}
.post-h .who{min-width:0;flex:1}
.post-h .nm{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-h .meta{font-size:12px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kindchip{font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:99px;color:#fff;text-transform:uppercase;white-space:nowrap}
.k-tip{background:linear-gradient(135deg,#FF9F1C,#FF4FA3)} .k-reel{background:linear-gradient(135deg,#FF4FA3,#C15CFF)} .k-podcast{background:linear-gradient(135deg,#2EE6C9,#7C5CFF)} .k-carrusel{background:linear-gradient(135deg,#C6F432,#2EE6C9);color:#052} .k-pregunta{background:linear-gradient(135deg,#C15CFF,#7C5CFF)}
.post-b{padding:0 16px 8px}
.post-b .ttl{font-family:var(--display);font-size:18px;font-weight:700;margin-bottom:4px}
.post-b .txt{color:var(--text);opacity:.92;white-space:pre-wrap;word-wrap:break-word}
.post-b .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px}
.post-media{margin:4px 16px 10px;border-radius:18px;overflow:hidden;position:relative}
.tipcard{padding:26px 22px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.tipcard .emo{font-size:54px;position:absolute;right:16px;top:8px;opacity:.9;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.tipcard .t{font-family:var(--display);font-size:24px;font-weight:700;max-width:80%;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.tipcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;mix-blend-mode:luminosity}
.qcard{padding:22px;background:linear-gradient(135deg,rgba(193,92,255,.22),rgba(124,92,255,.16));border:1px solid rgba(193,92,255,.35);border-radius:18px}
.qcard .q{font-family:var(--display);font-size:20px;font-weight:700}
.qcard .qm{font-size:12px;color:var(--muted);margin-top:6px}
.moodlebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:rgba(249,128,18,.12);color:#F98012;border:1px solid rgba(249,128,18,.35);margin-top:8px;text-decoration:none}
.recobadge{display:block;font-size:12px;font-weight:600;margin:0 16px 8px;padding:7px 11px;border-radius:12px;background:rgba(198,244,50,.08);border:1px solid rgba(198,244,50,.25);color:var(--lime)}
:root[data-theme="light"] .recobadge{color:#3F6212}
.reacts{display:flex;gap:6px;padding:8px 12px 12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:6px}
.rb{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted);transition:.15s;border:1px solid transparent}
.rb:hover{background:var(--surface2);color:var(--text)}
.rb.on{background:var(--surface2);color:var(--text);border-color:var(--line2)}
.rb.on.ok{color:var(--green);border-color:rgba(46,229,157,.4)}
.rb.on.duda{color:var(--amber);border-color:rgba(255,201,60,.4)}
.rb.on.sirvio{color:var(--cyan);border-color:rgba(46,230,201,.4)}
.rb .n{font-variant-numeric:tabular-nums}
.rb.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.reacts .sp{flex:1}
.views{font-size:12px;color:var(--dim);padding:0 6px}

/* Comments */
.comments{padding:4px 16px 14px;display:none}
.comments.open{display:block}
.cm{display:flex;gap:10px;padding:8px 0}
.cm .bubble{flex:1;min-width:0;background:var(--surface2);border-radius:4px 16px 16px 16px;padding:9px 12px;border:1px solid transparent}
.cm.util > div > .bubble{border-color:rgba(255,201,60,.45);background:rgba(255,201,60,.07)}
.cm .bubble .n{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cm .bubble .x{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.cm .acts{display:flex;gap:12px;font-size:12px;color:var(--dim);margin-top:4px;padding-left:4px}
.cm .acts button{color:var(--dim);font-weight:700;font-size:12px}
.cm .acts button:hover,.cm .acts button.on{color:var(--amber)}
.cm .replies{margin-left:42px}
.cmform{display:flex;gap:8px;margin-top:8px}
.cmform input{flex:1}
.typing{display:inline-flex;gap:4px;padding:10px 12px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Reel */
.reel{position:relative;aspect-ratio:9/13;max-height:520px;margin:0 auto;border-radius:18px;overflow:hidden;cursor:pointer;background:#111;color:#fff;isolation:isolate}
.reel .bg{position:absolute;inset:-20%;z-index:-1;background:linear-gradient(135deg,var(--g1),var(--g2));animation:drift 9s ease-in-out infinite alternate}
.reel .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(0,0,0,.35),transparent 50%)}
@keyframes drift{to{transform:rotate(8deg) scale(1.08)}}
.reel .prog{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}
.reel .prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.reel .prog i b{display:block;height:100%;width:0;background:#fff}
.reel .prog i.done b{width:100%}
.reel .stage{position:absolute;inset:0;display:grid;place-items:center;padding:36px 26px}
.reel .slide{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.2vw,30px);text-align:center;text-shadow:0 3px 18px rgba(0,0,0,.35);line-height:1.2;animation:slidein .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slidein{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.reel .play{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;background:rgba(0,0,0,.18);transition:.2s;z-index:3}
.reel.playing .play{opacity:0}
.reel .sec{position:absolute;bottom:12px;left:14px;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:99px;z-index:2}
.reel video{width:100%;height:100%;object-fit:cover}

/* Reels view */

/* Podcast */

/* ---------- Reproductor de EduReels ---------- */
const Reels = {
  cur: null, timer: null,
  toggle(el) { if (this.cur === el) this.pause(); else this.play(el); },
  play(el) {
    if (this.cur && this.cur !== el) this.pause();
    const p = postById(el.dataset.reel); if (!p || !$('.stage', el)) return;
    this.cur = el; el.classList.add('playing'); el._i = el._i || 0; this.step(el, p);
  },
  step(el, p) {
    clearTimeout(this.timer);
    const slides = p.slides?.length ? p.slides : [p.title]; const i = el._i % slides.length;
    $$('.prog i', el).forEach((b, j) => { const bb = b.firstElementChild; bb.style.transition = 'none'; bb.style.width = j < i ? '100%' : '0'; });
    const cur = $$('.prog i', el)[i]?.firstElementChild;
    if (cur) { void cur.offsetWidth; cur.style.transition = 'width 2.8s linear'; cur.style.width = '100%'; }
    const st = $('.stage', el); if (!st) return; st.innerHTML = `<div class="slide">${esc(slides[i])}</div>`;
    if (i === 2 && !el._viewed) { el._viewed = true; p.views++; emit('reel_view', 'me', { title: p.title, materia: p.level === 'mat' ? p.scope : null, tags: p.tags }); }
    this.timer = setTimeout(() => { if (this.cur !== el || !document.body.contains(el)) return; el._i = (i + 1) % slides.length; this.step(el, p); }, 2800);
  },
  pause() {
    if (!this.cur) return; clearTimeout(this.timer);
    const el = this.cur; el.classList.remove('playing');
    $$('.prog i b', el).forEach(b => { const w = getComputedStyle(b).width; b.style.transition = 'none'; b.style.width = w; });
    this.cur = null;
  }
};
/* ---------- Reproductor de EduPodcasts (voz sintética) ---------- */
const Pod = {
  cur: null,
  toggle(id) {
    if (this.cur === id) { speechSynthesis.cancel(); this.stop(); return; }
    if (!('speechSynthesis' in window)) { toast('Tu navegador no tiene voz sintética 😕'); return; }
    this.stop(); speechSynthesis.cancel();
    const p = postById(id); const text = (p.script || p.body || p.title);
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => /es[-_](AR|419)/i.test(v.lang)) || voices.find(v => /es[-_](MX|US)/i.test(v.lang)) || voices.find(v => /^es/i.test(v.lang));
    if (v) u.voice = v; u.lang = v?.lang || 'es-AR';
    u.rate = +($(`[data-pod="${id}"] select`)?.value || 1);
    u.onboundary = e => { const pct = Math.min(100, e.charIndex / text.length * 100); $$(`[data-pod="${id}"] .pbar b`).forEach(b => b.style.width = pct + '%'); };
    u.onend = () => { if (this.cur === id) this.stop(); };
    speechSynthesis.speak(u); this.cur = id;
    $$(`[data-pod="${id}"]`).forEach(el => { el.classList.add('playing'); const b = $('.pbtn', el); if (b) b.textContent = '❚❚'; });
    p.views++;
    emit('pod_play', 'me', { title: p.title, materia: p.level === 'mat' ? p.scope : null, tags: p.tags });
  },
  stop() {
    if (this.cur) $$(`[data-pod="${this.cur}"]`).forEach(el => { el.classList.remove('playing'); const b = $('.pbtn', el); if (b) b.textContent = '▶'; });
    this.cur = null;
  }
};

async function imageToDataURL(file) {
  const img = new Image(); const url = URL.createObjectURL(file);
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url); return c.toDataURL('image/jpeg', .72);
}

  await sleep(1800);

    else {
      const need = topNeeds(tw, 1)[0];
      if (p.kind === 'pregunta') { text = need.id === 'pertenencia' || Math.random() < .5 ? `¡Me pasa lo mismo! 🙋 ${hasSkill(tw.skills, 'tejer-vinculos') ? '¿Armamos un grupo en la microred de la materia? ' : ''}${hasSkill(tw.skills, 'andamiaje-dudas') ? 'Si alguien responde con un ejemplo cotidiano, mejor.' : ''}` : `Buena pregunta. Yo también me trabé con eso: ¿probaste mirar el resumen de la unidad? ${pick(TWIN_CMT[need.id])}`; reaction = 'duda'; }

    }
    if (!p.reactions[reaction].includes(tw.id)) p.reactions[reaction].push(tw.id);
    p.views += 3 + Math.floor(Math.random() * 12);
    addAgentComment(p, tw.id, text);

  setTimeout(() => { const peer = pick(PEERS); if (!p.reactions.sirvio.includes(peer)) { p.reactions.sirvio.push(peer); p.views += 5; save(); refreshPost(p.id); checkBadges(); } }, 9000);
}

  const tw = S.twins.find(t => t.id === p.author) || (/\?/.test(c.text) && Math.random() < .6 ? S.twins.filter(t => !t.mirror).sort((a, b) => relevance(b, p) - relevance(a, p))[0] : null);
  if (!tw) return;
  await sleep(1500); showTyping(p.id, tw.id);
  const r = await Harness.json('twins', { system: twinSystem(tw), messages: [{ role: 'user', content: `Publicación: "${p.title}"\nUna persona estudiante real comentó: "${c.text}"\nRespondele breve (≤45 palabras) y decidí si su comentario te resultó útil para tu aprendizaje. JSON {"reply":"...","util":true|false}` }], maxTokens: 250 });
  let text, util;

  addAgentComment(p, tw.id, text, parent || c);
  checkBadges();
}

/* ---------- Gemelos: tarjetas y radar ---------- */
function radar(needs, size = 240, color = '#C6F432') {
  const c = size / 2, R = size / 2 - 34, n = DIMS.length;
  const pt = (i, r) => [c + r * Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n), c + r * Math.sin(-Math.PI / 2 + i * 2 * Math.PI / n)];
  const rings = [.25, .5, .75, 1].map(k => `<polygon points="${DIMS.map((_, i) => pt(i, R * k).join(',')).join(' ')}" fill="none" style="stroke:var(--line2)" stroke-width="1"/>`).join('');
  const axes = DIMS.map((_, i) => `<line x1="${c}" y1="${c}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}" style="stroke:var(--line)"/>`).join('');
  const poly = DIMS.map((d, i) => pt(i, R * needs[d.id]).join(',')).join(' ');
  const labels = DIMS.map((d, i) => { const [x, y] = pt(i, R + 18); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" style="fill:var(--muted)">${d.short}</text>`; }).join('');
  const dots = DIMS.map((d, i) => { const [x, y] = pt(i, R * needs[d.id]); return `<circle cx="${x}" cy="${y}" r="3.2" fill="${color}"><title>${d.label}: ${Math.round(needs[d.id] * 100)}%</title></circle>`; }).join('');
  return `<svg class="radar" viewBox="-22 -4 ${size + 44} ${size + 8}" role="img" aria-label="Radar de necesidades cognitivas">${rings}${axes}<polygon points="${poly}" fill="${color}" fill-opacity=".22" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

      <g transform="translate(400 240)"><circle r="52" fill="url(#gCore)"/><path d="M-40 -8c12 6 20-8 34-2s14 16 30 10" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/><circle r="52" fill="url(#gShine)"/><text y="6" text-anchor="middle" font-size="30">🔮</text></g>
      <g id="oNodes"></g><g id="oPulses"></g>`;
    const mk = (id, ring, i, n) => ({ id, ring, a0: i / n * Math.PI * 2 + (ring ? .4 : 0) });
    this.nodes = [...HOSTS.map((h, i) => mk(h.id, 0, i, HOSTS.length)), ...S.twins.map((t, i) => mk(t.id, 1, i, S.twins.length))];
    const g = $('#oNodes', svg);
    this.nodes.forEach(n => {
      const u = user(n.id); const el = document.createElementNS(NS, 'g'); el.setAttribute('class', 'onode');
      el.innerHTML = `<circle r="${n.ring ? 24 : 21}" style="fill:hsl(${u.hue} 70% 55% / .9)" stroke="${n.ring ? '#C6F432' : '#2EE6C9'}" stroke-width="2.5"/><text text-anchor="middle" dy="7" font-size="${n.ring ? 20 : 18}">${u.emoji}</text><text text-anchor="middle" y="${n.ring ? 40 : 36}" font-size="11" font-weight="700" style="fill:var(--muted)">${esc(u.short || u.name)}</text><title>${esc(u.name)}</title>`;
      g.appendChild(el); n.el = el;
    });
    cancelAnimationFrame(this.raf); this.loop();
  },
  pos(n, t) { const R = n.ring ? 320 : 175, ry = n.ring ? 150 : 84, sp = n.ring ? -0.00006 : 0.0001; const a = n.a0 + t * sp; return [400 + R * Math.cos(a), 240 + ry * Math.sin(a)]; },
  loop() {
    if (!this.on || !this.svg || !document.body.contains(this.svg)) { this.on = false; return; }
    const t = performance.now();
    for (const n of this.nodes) { const [x, y] = this.pos(n, t); n.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(0.82 + (y - 90) / 300 * .3).toFixed(3)})`); n.el.style.opacity = (0.55 + (y - 90) / 300 * .45).toFixed(2); }
    const pg = $('#oPulses', this.svg);
    this.pulses = this.pulses.filter(p => {
      const k = (t - p.start) / 1100; if (k < 0) return true;
      const n = this.nodes.find(x => x.id === p.id); if (!n) return false;
      if (!p.el) { p.el = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); p.el.setAttribute('r', 6); p.el.setAttribute('fill', '#C4B5FD'); p.el.setAttribute('style', 'filter:drop-shadow(0 0 6px #C15CFF)'); pg.appendChild(p.el); }
      const [x, y] = this.pos(n, t); const e = 1 - Math.pow(1 - Math.min(1, k), 3);
      p.el.setAttribute('cx', 400 + (x - 400) * e); p.el.setAttribute('cy', 240 + (y - 240) * e);
      if (k >= 1) { p.el.remove(); const c = n.el.firstElementChild; c.animate([{ strokeWidth: 8 }, { strokeWidth: 2.5 }], { duration: 700 }); return false; }
      return true;
    });
    this.raf = requestAnimationFrame(() => this.loop());
  },
  burst(ids) { const t = performance.now(); ids.forEach((id, i) => this.pulses.push({ id, start: t + i * 90 })); }
};

function simulatePeers(n = 6) {
  for (let i = 0; i < n; i++) {
    const peer = pick(PEERS); const pu = S.users[peer];
    const pool = S.posts.filter(p => !p.hidden && p.author !== peer && (p.level === 'inst' || p.scope === pu.fac || pu.materias?.includes(p.scope) || Math.random() < .2));
    const p = pick(pool); if (!p) continue;
    const r = Math.random();
    if (r < .72) {
      const kind = Math.random() < .38 ? 'duda' : Math.random() < .6 ? 'sirvio' : 'ok';
      if (!p.reactions[kind].includes(peer)) { p.reactions[kind].push(peer); p.views++; emit('react', peer, { kind, title: p.title, tags: p.tags, materia: p.level === 'mat' ? p.scope : null, fac: pu.fac, postId: p.id }); refreshPost(p.id); }
    } else { p.saves.push(peer); emit('save', peer, { title: p.title, tags: p.tags, materia: p.level === 'mat' ? p.scope : null, fac: pu.fac }); }
  }
  if (S.ui.view === 'gemelos') renderView('gemelos');
}

async function apStep() {

  const r = await Harness.call('director', { system: 'Sos el Director Agente de Planeta Azul. Redactás informes breves para equipos de diseño instruccional y docentes de educación a distancia. Español rioplatense, claro, accionable. Sin markdown pesado: usá títulos cortos en MAYÚSCULAS y viñetas con "•".', messages: [{ role: 'user', content: `Datos del enjambre de gemelos digitales (necesidades cognitivas aprendidas de señales reales):\n${data}\n\nRedactá un informe de máx 260 palabras: 1) panorama, 2) necesidades prioritarias por perfil, 3) 4 recomendaciones concretas para docentes y diseño instruccional (formatos, momentos, recursos).` }], maxTokens: 900 });

  openModal(mh('📄 Informe de necesidades cognitivas') + `<div class="small muted mb">Fuente: ${r ? PROVIDERS[r.provider].label : 'modo demo'} · ${new Date().toLocaleString('es-AR')}</div>
    <div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${sorted.map(d => `<div class="needbar" style="margin:0"><span class="l">${d.label}</span><span class="b"><i style="width:${Math.round(d.v * 100)}%"></i></span><span class="v">${Math.round(d.v * 100)}%</span></div>`).join('')}</div>
    <div class="card mt" style="white-space:pre-wrap;font-size:14px">${esc(txt)}</div>
    <div class="row mt" style="justify-content:flex-end;gap:8px"><button class="btn sm" data-act="copyReport">📋 Copiar</button></div>`, true);
  RT.lastReport = txt;
}

    <div class="row wrap" style="gap:6px;margin:6px 0">${['¿Qué es lo que más te cuesta?', '¿Qué formato te ayuda más?', '¿Qué te haría no abandonar?', '¿Cómo te preparás para un parcial?'].map(q => `<button class="chip" style="font-size:12px" data-act="ivQuick" data-q="${q}">${q}</button>`).join('')}</div>

async function ivAsk(q) {

function moodlePublish(o) {

}

function matStats(m) {

  const unanswered = P.filter(p => p.kind === 'pregunta' && !humanAns(p)).length;
  const util = P.reduce((a, p) => a + p.comments.filter(c => c.util?.length).length + p.comments.reduce((b, c) => b + c.replies.filter(x => x.util?.length).length, 0), 0);

  const maxSig = Math.max(1, ...Object.values(sig));

  const doubtW = pool.reduce((a, t) => a + (t.doubts[matName(m)] || 0), 0);

    <div class="cp"><nav class="cp-nav">${c.modules.map((m, j) => `<button class="cp-m ${j === i ? 'on' : ''} ${en.done[j] ? 'done' : ''}" data-act="cpGo" data-j="${j}">${en.done[j] ? '✓' : j + 1 + '.'} ${esc(m.title)}<span>${TI[m.type]} ${m.min} min</span></button>`).join('')}</nav><section class="cp-body">${inner}</section></div>`, true);
}
function finishCourse(c, en) {
  en.finished = now(); en.mod = -1;
  const sc = en.total ? en.correct / en.total : .7; c.cohort.completed++; c.cohort.scores.push(+sc.toFixed(2));
  addXP(50, c.skills);
  emit('course_done', 'me', { title: c.title, materia: c.materia, dims: c.targetDims });
  checkBadges();
}

/* ---------- Acciones ---------- */
Object.assign(ACT, {
  acTab: a => { closeModal(); RT.acTab = a.dataset.t; if (S.ui.view !== 'academia') renderView('academia'); else renderView('academia'); },
  acGoGami: () => { closeModal(); RT.acTab = 'gami'; renderView('academia'); },
  acRunDiag: async a => { a.disabled = true; a.innerHTML = '<span class="spinner"></span>El enjambre está diagnosticando…'; const dg = await runDiagnosis(RT.acMat, RT.acCar); RT.acDiag = dg.id; toast(`🩺 Diagnóstico de ${esc(matName(dg.materia))} listo y anunciado en la microred`); renderView('academia'); },
  acDiagOpen: a => { const dg = diagById(a.dataset.id); if (!dg) return; closeModal(); RT.acTab = 'diag'; RT.acMat = dg.materia; RT.acCar = dg.carrera; RT.acDiag = dg.id; renderView('academia'); window.scrollTo({ top: 0 }); },
  acDesign: async a => { const dg = diagById(a.dataset.id); a.disabled = true; a.innerHTML = '<span class="spinner"></span>Diseñando…'; const c = await runDesign(dg); toast(`🎓 Curso «${esc(c.title)}» y 2 retos publicados en ${esc(matName(c.materia))}`, 'dir'); RT.acTab = 'cursos'; renderView('academia'); },
  acSkills: a => { const dg = diagById(a.dataset.id); const sk = skillsFromDiagnosis(dg); save(); toast(`🧩 ${sk.length} skills de interacción enseñadas al enjambre: ${sk.map(s => '«' + esc(s.name) + '»').join(', ')}`, 'dir'); },
  acCohort: a => { const c = courseById(a.dataset.id); closeCohort(c); RT.acTab = 'impacto'; renderView('academia'); },
  acAuto: () => { A().auto = !A().auto; save(); renderView('academia'); toast(A().auto ? '🤖 El enjambre diseñará cursos automáticamente en cada ciclo' : 'Diseño automático pausado'); },
  acCycle: async a => { a.disabled = true; a.innerHTML = '<span class="spinner"></span>Ciclo en curso…'; await _directorCycle({}); const c = await autoCycle(true); if (!c) toast('🔄 Ciclo completo: las microredes no muestran debilidades nuevas que justifiquen otro curso'); renderView('academia'); },
  courseOpen: a => openCourse(a.dataset.id),
  cpGo: a => { const en = A().enroll[RT.cp]; en.mod = +a.dataset.j; renderPlayer(); },
  cpDuda: () => { const c = courseById(RT.cp); const en = A().enroll[c.id]; en.extra = en.extra || {}; en.extra[en.mod] = true; emit('course_step', 'me', { title: c.title, materia: c.materia, dim: 'conceptual', text: 'no entiendo' }); renderPlayer(); },
  cpStep: a => { const en = A().enroll[RT.cp]; const s = en.steps[en.mod] = en.steps[en.mod] || []; s[+a.dataset.j] = !s[+a.dataset.j]; save(); renderPlayer(); },
  cpAns: a => {
    const c = courseById(RT.cp); const en = A().enroll[c.id]; const M = c.modules[en.mod]; const j = +a.dataset.q, o = +a.dataset.o;
    const ans = en.answers[en.mod] = en.answers[en.mod] || {}; if (ans[j] !== undefined) return; ans[j] = o; const ok = o === M.quiz[j].a;
    en.total++; if (ok) { en.correct++; addXP(10, c.skills); }
    emit('quiz', 'me', { title: c.title, materia: c.materia, ok, dim: ok ? c.targetDims[0] : 'conceptual' });
    renderPlayer();
  },
  cpDone: () => {
    const c = courseById(RT.cp); const en = A().enroll[c.id]; const i = en.mod; const M = c.modules[i];
    if (M.type === 'reflexion') { const t = ($('#cpRefl')?.value || '').trim(); en.notes[i] = t; }
    if (!en.done[i]) { en.done[i] = true; addXP(20, c.skills); emit('course_step', 'me', { title: c.title, materia: c.materia, dim: M.type === 'practica' ? 'practica' : c.targetDims[0], text: en.notes[i] || '' }); }
    const next = en.done.findIndex(d => !d);
    if (next === -1) { if (!en.finished) finishCourse(c, en); else en.mod = -1; } else en.mod = next;
    save(); renderPlayer(); if (S.ui.view === 'academia') renderView('academia');
  },
  cpShare: () => {
    const c = courseById(RT.cp); const M = matName(c.materia); closeModal();
    const p = createPost({ author: 'me', kind: 'tip', level: 'mat', scope: c.materia, emoji: '🏅', grad: ['#FFC93C', '#FF4FA3'], title: `Completé el curso «${c.title}»`, body: `Lo que más me sirvió: la práctica situada en ${careerName(c.carrera)}. Si te cuesta ${c.concept}, ¡arrancá por el módulo "Idea clave"!`, tags: ['#Curso' + camel(M), '#Tips' + camel(M)] });
    emit('post', 'me', { kind: 'tip', title: p.title, tags: p.tags, materia: c.materia }); S.ui.level = 'mat'; S.ui.mat = c.materia; S.ui.tag = null; renderView('orbita'); agentsRespondToPost(p); checkBadges();
  },
  questAccept: a => { const q = questById(a.dataset.id); A().questProg[q.id] = { accepted: now(), done: q.steps.map(() => false) }; q.participants++; addXP(10, [q.skill]); emit('quest_accept', 'me', { title: q.title, materia: q.materia }); toast(`🎮 Reto aceptado: ${esc(q.title)}`); renderView(S.ui.view); },
  questStep: a => {
    const q = questById(a.dataset.id); const pr = A().questProg[q.id]; const i = +a.dataset.i; if (pr.completed || pr.done[i]) return;
    pr.done[i] = true; addXP(15, [q.skill]); emit('quest_step', 'me', { title: q.title, materia: q.materia });
    if (pr.done.every(Boolean)) { pr.completed = now(); addXP(q.xp, [q.skill]); emit('quest_done', 'me', { title: q.title, materia: q.materia }); toast(`🏆 ¡Reto completado! +${q.xp} XP en ${esc(q.skill)}`); checkBadges(); }
    save(); if (S.ui.view === 'orbita') { const p = S.posts.find(x => x.quest === q.id); if (p) refreshPost(p.id); } else renderView(S.ui.view);
  },
  storyVote: a => { const s = SV.list[SV.i]; s.votes = s.votes || {}; s.votes.me = +a.dataset.j; emit('story_vote', 'me', { text: s.text + ' → ' + s.options[+a.dataset.j], dim: s.dimOpts?.[+a.dataset.j], materia: s.materia }); save(); showStory(); },
});
const _react = ACT.react;
ACT.react = a => {
  _react(a); const p = postById(a.dataset.id);
  if (a.dataset.k === 'duda' && p?.reactions.duda.includes('me')) { const c = A().courses.find(c => c.status === 'activo' && c.materia === p.scope); if (c) setTimeout(() => { RT.host = 'sabia'; hostBubble(`Para esa duda hay un curso autoasistido de ${matName(c.materia)}: «${c.title}». Empezá por el módulo "Idea clave".`, 9000); }, 1200); }
};
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset.actChange === 'acMat') { RT.acMat = t.value; RT.acDiag = null; RT.acCar = careerFor(t.value); renderView('academia'); }
  if (t.dataset.actChange === 'acCar') { RT.acCar = t.value; RT.acDiag = null; renderView('academia'); }
});

/* ---------- Semilla: la red ya vivió un ciclo ---------- */
function seed() {
  const a = A(); if (a.courses.length) return;
  const back = (obj, h) => { obj.ts = now() - h * H; return obj; };
  const dg1 = diagHeuristic('matematica-i', 'cont'); back(dg1, 30); a.diagnoses.push(dg1);
  const base1 = designHeuristic(dg1); const car1 = CAREER.cont;
  const c1 = back({ id: uid('cu'), materia: 'matematica-i', carrera: 'cont', diagId: dg1.id, ...base1, emoji: '🎓', concept: dg1.concept, skills: car1.skills.slice(0, 2), minutes: base1.modules.reduce((x, m) => x + m.min, 0), source: 'heurística', status: 'activo', cohort: { enrolled: 21, completed: 16, scores: Array.from({ length: 16 }, () => +(.6 + Math.random() * .35).toFixed(2)) }, pilot: { twins: 1, score: 74 }, grad: ['#FFC93C', '#FF7A59'], pre: {} }, 28);
  a.courses.push(c1); c1.questIds = makeQuests(dg1, c1.id).map(q => q.id); a.quests.forEach(q => q.participants = 6 + Math.floor(Math.random() * 9));
  skillsFromDiagnosis(dg1);
  [announceCourse(c1)].forEach(p => p && back(p, 27)); S.posts.filter(p => p.quest && !p.ts0).forEach(p => back(p, 26));
  closeCohort(c1, { silent: true }); S.posts.filter(p => p.course === c1.id && p.sub === 'cierre').forEach(p => back(p, 3));
  const dg2 = diagHeuristic('introduccion-al-derecho', 'abog'); back(dg2, 6); a.diagnoses.unshift(dg2);
  announceDiagnosis(dg2); S.posts.filter(p => p.diag === dg2.id).forEach(p => back(p, 5));
  const base2 = designHeuristic(dg2); const c2 = back({ id: uid('cu'), materia: 'introduccion-al-derecho', carrera: 'abog', diagId: dg2.id, ...base2, emoji: '🎓', concept: dg2.concept, skills: CAREER.abog.skills.slice(0, 2), minutes: base2.modules.reduce((x, m) => x + m.min, 0), source: 'heurística', status: 'activo', cohort: { enrolled: 9, completed: 4, scores: [.8, .7, .9, .65] }, pilot: { twins: 1, score: 71 }, grad: ['#FF7A59', '#C15CFF'], pre: {} }, 4);
  a.courses.unshift(c2); c2.questIds = makeQuests(dg2, c2.id).map(q => q.id); a.quests.filter(q => q.courseId === c2.id).forEach(q => q.participants = 3 + Math.floor(Math.random() * 5));
  skillsFromDiagnosis(dg2);
  announceCourse(c2); S.posts.filter(p => (p.course === c2.id || (p.quest && c2.questIds.includes(p.quest)))).forEach(p => back(p, 4));
  S.director.insights.unshift('🎓 Arranque: la Academia ya completó un ciclo (Matemática I) y tiene un curso activo en Introducción al Derecho.');
  save();
}

A(); seed();
renderView(S.ui.view);
if (!S.me && !$('#modal').classList.contains('open')) onboarding();
window.PlanetaAcademy = { runDiagnosis, runDesign, closeCohort, autoCycle, diagHeuristic };
})();

renderNav = function () {
  const modQ = S.posts.filter(p => p.reports.length && !p.reviewed).length;
  $('#sideNav').innerHTML = NAV.map(n => n.sep ? `<div class="navsep">${n.sep}</div>` : `<button class="navbtn ${S.ui.view === n.v ? 'on' : ''}" data-act="nav" data-v="${n.v}"><span class="ic">${ic(NICON[n.v])}</span>${n.l}${n.v === 'nucleo' ? `<span class="pill">${S.director.skills.length}</span>` : ''}${n.v === 'moderacion' && modQ && S.me?.amb ? `<span class="pill">${modQ}</span>` : ''}</button>`).join('');
  const mob = ['orbita', 'microredes', 'academia', 'reels', 'perfil'];
  $('#bottomNav').innerHTML = mob.map(v => { const n = navOf(v); return `<button class="${S.ui.view === v ? 'on' : ''}" data-act="nav" data-v="${v}"><span>${ic(NICON[v], 21)}</span>${n.l.replace('Edu', '')}</button>`; }).join('') + `<button data-act="more"><span>☰</span>Más</button>`;
  $('#instName').textContent = 'Aprendé, compartí, orbitá';

function updateTop() {
  const me = $('#topMe'); if (me) me.innerHTML = `${avatar('me', 'sm')}${ic('chevd', 16)}`;

function baseFeed() {
  const u = S.ui; let L = S.posts.filter(p => !p.hidden || p.author === 'me');
  if (u.q) { const q = u.q.toLowerCase(); L = L.filter(p => (p.title + ' ' + (p.body || '') + ' ' + p.tags.join(' ') + ' ' + (user(p.author).name || '') + ' ' + (p.scope ? matName(p.scope) : '')).toLowerCase().includes(q)); }
  else if (u.tag) L = L.filter(p => p.tags.some(t => t.toLowerCase() === u.tag.toLowerCase()));
  else if (u.level === 'inst') L = L.filter(p => p.level === 'inst');
  else if (u.level === 'fac') L = L.filter(p => (p.level === 'fac' && p.scope === u.fac) || (p.level === 'mat' && p.scope !== 'ambientacion-virtual' && MATERIAS[p.scope]?.facs.has(u.fac)));
  else if (u.level === 'mat') L = L.filter(p => p.level === 'mat' && p.scope === u.mat);
  else if (u.level === 'ia') L = L.filter(p => ['twin', 'host', 'director'].includes(user(p.author).type));
  else if (u.level === 'cursos') L = L.filter(p => ['curso', 'reto', 'pulso'].includes(p.kind));
  else if (u.level === 'bienestar') L = L.filter(p => p.dims.some(d => ['pertenencia', 'tiempo', 'evaluacion'].includes(d)) || p.tags.some(t => /^#(Tips|Ingresantes|Grupo)/i.test(t)));
  return L.sort((a, b) => score(b) - score(a));
}

  clearQ: () => { S.ui.q = ''; const g = $('#gSearch'); if (g) g.value = ''; renderView('orbita'); },
  setTheme: a => { S.ui.theme = a.dataset.t; document.documentElement.dataset.theme = S.ui.theme; save(); renderView(S.ui.view); },
  theme: () => { S.ui.theme = S.ui.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = S.ui.theme; save(); renderView(S.ui.view); },
  heroGo: a => { Reels.pause(); RT.heroI = (RT.heroI || 0) + +a.dataset.d; refreshHeroStrip(); },
  stripGo: () => { const r = $('#stripRow'); if (r) r.scrollBy({ left: r.clientWidth * .8, behavior: 'smooth' }); },
  heroAsk: a => { const p = postById(a.dataset.id); hostOpen(p.kind === 'curso' || p.kind === 'reto' ? 'sabia' : undefined); hostAsk(`Ayudame con "${p.title}"`); },
  follow: a => { seedSocial(); const id = a.dataset.id; const i = S.follows.indexOf(id); if (i >= 0) S.follows.splice(i, 1); else { S.follows.push(id); emit('join', 'me', { name: user(id).name, fac: user(id).fac }); toast(`✨ Ahora seguís a ${esc(user(id).short || user(id).name)}`); } save(); },
  meetJoin: a => {
    seedSocial(); const id = a.dataset.id; S.meetupsJoined = S.meetupsJoined || {};
    const m = S.meetups.find(x => x.id === id);
    if (m) m.joined = !m.joined; else S.meetupsJoined[id] = !S.meetupsJoined[id];
    const on = m ? m.joined : S.meetupsJoined[id];
    if (on) { emit('join', 'me', { name: m ? m.title : 'cierre de cohorte', materia: m?.materia }); toast('📅 Te anotaste. Los anfitriones te van a recordar el encuentro.'); }
    save(); renderRail();
  },
  notif: () => {
    const L = S.events.filter(e => e.actor !== 'me').slice(-20).reverse(); RT.notifSeen = S.events.length; updateTop();
    openModal(mh('🔔 Actividad del planeta') + `<div class="small muted mb">Lo que hicieron tu comunidad y los enjambres IA.</div><div>${L.map(e => `<div class="notif">${avatar(e.actor, 'sm')}<div style="flex:1">${esc(evText(e))}<div class="small dim">${ago(e.ts)}</div></div></div>`).join('') || '<div class="empty">Sin novedades todavía.</div>'}</div>`);
  },
  groupOpen: () => { const m = groupMat(); const G = groupOf(m); if (!G.joined) { G.joined = true; emit('join', 'me', { name: 'Grupo de ' + matName(m), materia: m }); save(); } RT.gm = m; renderGroup(); },
});
function renderGroup() {
  const m = RT.gm; const G = groupOf(m);
  openModal(mh(`👥 Grupo de estudio · ${esc(matName(m))}`) + `<div class="row small muted"><span class="online-dot"></span>${G.members.length + 6} en línea · estudiantes, un gemelo 🧬 y una anfitriona 🧭</div>
    <div class="gchat mt" id="gChat">${G.msgs.map(x => `<div class="gmsg ${x.author === 'me' ? 'me' : ''}">${avatar(x.author, 'sm')}<div class="b">${x.author !== 'me' ? `<b style="font-size:11.5px">${esc(user(x.author).short || user(x.author).name)}</b> ${['twin', 'host'].includes(user(x.author).type) ? '<span class="badge twin" style="font-size:9.5px">IA</span>' : ''}<br>` : ''}${esc(x.text)}</div></div>`).join('')}</div>
    <form class="hp-in" id="gForm" style="padding:10px 0 0;border:0"><input class="in" id="gIn" placeholder="Escribile al grupo…" autocomplete="off"><button class="btn pri">➤</button></form>`, true);
  const c = $('#gChat'); c.scrollTop = c.scrollHeight;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'gForm') return; e.preventDefault();
  const i = $('#gIn'); const t = i.value.trim(); if (!t) return; i.value = '';
  const m = RT.gm; const G = groupOf(m);
  G.msgs.push({ author: 'me', text: t, ts: now() }); emit('comment', 'me', { text: t, title: 'Grupo de ' + matName(m), materia: m }); save(); renderGroup();
  const tw = S.twins.find(x => x.id === G.members.find(id => id.startsWith('tw_')));
  const useHost = classify(t).includes('digital');
  await sleep(900);
  let reply;
  if (useHost) { const h = hostById('luma'); reply = { author: h.id, text: stripGo(await hostAnswer(h, t)) }; }
  else {
    const r = await Harness.call('twins', { system: twinSystem(tw) + '\nEstás en un grupo de estudio de la microred con compañeros. Respondé breve (≤50 palabras) como compañero/a, aplicando tus skills.', messages: [...G.msgs.slice(-6).map(x => ({ role: x.author === tw.id ? 'assistant' : 'user', content: (x.author === 'me' ? '' : (user(x.author).short || user(x.author).name) + ': ') + x.text }))], maxTokens: 220 });
    const dm = DIMS.find(d => d.id === (classify(t)[0] || topNeeds(tw, 1)[0].id)); const cs = (S.academy?.courses || []).find(c => c.materia === m && c.status === 'activo');
    reply = { author: tw.id, text: r ? r.text : `A mí me pasa parecido 🧬. Lo que más me sirve es buscar ${dm.help}.${cs ? ` En Cursos está «${cs.title}», arranquemos juntos por el módulo de práctica.` : ''}${hasSkill(tw.skills, 'pregunta-inversa') ? ' ¿Qué intentaste vos hasta ahora?' : ''}` };
  }
  G.msgs.push({ ...reply, ts: now() }); G.msgs = G.msgs.slice(-40); save();
  if ($('#gChat')) renderGroup(); renderRail();
});

seedSocial();
if (!S.ui.theme) S.ui.theme = 'dark';
document.documentElement.dataset.theme = S.ui.theme;
renderView(S.ui.view);
if (!S.me && !$('#modal').classList.contains('open')) onboarding();
})();

</script>
<!-- Guía interactiva: recorrido con narración opcional por Gemini Live. Se abre con el botón 🎓. -->
<script>
(() => {
  const LIVE_MODEL = 'gemini-3.1-flash-live-preview';
  const steps = [
    { view: 'orbita', sel: '#storiesBar', title: 'Órbita', text: 'Es el feed principal: publicaciones, historias y recursos ordenados por institución, facultad o materia.' },
    { view: 'reels', sel: '#reelsview .reel', title: 'EduReels', text: 'Explicaciones breves para entender una idea en pocos segundos. Tocá cada reel para pausarlo o continuarlo.' },
    { view: 'podcasts', sel: '#view .pod', title: 'EduPodcasts', text: 'Repasos cortos para escuchar. La velocidad de reproducción se adapta a tu ritmo de estudio.' },
    { view: 'microredes', sel: '#view .tree', title: 'Microredes', text: 'Las comunidades se organizan por institución, facultad y materia. Unirte personaliza lo que ves.' },
    { view: 'guardados', sel: '#view .row', title: 'Guardados', text: 'Lo que te sirve queda en colecciones para volver a estudiarlo más tarde.' },
    { view: 'perfil', sel: '#view .stats', title: 'Perfil', text: 'Resume tu identidad académica, tus aportes y su impacto en la comunidad.' },
    { view: 'gemelos', sel: '#view .twin', title: 'Gemelos digitales', text: 'Representan patrones agregados de necesidades de aprendizaje. No califican ni reemplazan a estudiantes reales.' },
    { view: 'academia', sel: '#view .acpipe', title: 'Academia IA', text: 'El enjambre diagnostica problemáticas, debilidades y fortalezas de cada materia y con eso diseña cursos autoasistidos y retos gamificados situados en tu carrera.' },
    { view: 'nucleo', sel: '#view .orbitwrap', title: 'Núcleo IA', text: 'El Director observa señales de la comunidad y propone skills sociales para mejorar el acompañamiento.' },
    { view: 'moderacion', sel: '#view .card', title: 'Convivencia', text: 'Las personas embajadoras revisan reportes y cuidan un intercambio respetuoso.' },
    { view: 'ajustes', sel: '#view .card', title: 'Motor IA', text: 'Acá se configuran proveedores y modelos de Gemini, OpenAI y DeepSeek para cada enjambre.' }
  ];
  let i = 0, running = false, ws = null, liveBusy = false, audioCtx = null, audioAt = 0;
  const q = s => document.querySelector(s);
  const escH = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const log = msg => { const l = q('#paGuideLog'); if (l) l.insertAdjacentHTML('afterbegin', `<div>• ${escH(msg)}</div>`); };
  const clearSpot = () => document.querySelectorAll('.paGuideSpotlight').forEach(el => el.classList.remove('paGuideSpotlight'));

  const ui = document.createElement('aside'); ui.id = 'paGuide'; ui.className = 'hide';
  ui.innerHTML = `<button id="paGuideClose" aria-label="Cerrar guía">✕</button>
    <div class="pa-kicker">GUÍA INTERACTIVA · <span id="paGuideStep"></span></div>
    <h2 id="paGuideTitle"></h2><p id="paGuideText"></p>
    <div class="pa-actions"><button id="paGuideBack">← Anterior</button><button id="paGuideNext" class="pa-pri">Siguiente →</button></div>
    <details class="pa-live"><summary>🔊 Narración con Gemini Live</summary>
      <label class="pa-lb">Voz<select id="paGuideLiveVoice"><option value="Kore">Kore · cálida</option><option value="Aoede">Aoede · serena</option><option value="Puck">Puck · enérgica</option><option value="Charon">Charon · grave</option></select></label>
      <label class="pa-lb">Clave (opcional: si queda vacía usa la de ⚙️ Motor IA)<input id="paGuideApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Usar clave configurada"></label>
      <div class="pa-actions"><button id="paGuideGemini" class="pa-pri">✨ Explicar este paso</button></div></details>
    <div class="pa-actions"><button id="paGuideDemo">▶ Demo automática</button></div>
    <div id="paGuideLog" aria-live="polite"></div>`;
  const style = document.createElement('style');
  style.textContent = `#paGuide{position:fixed;z-index:90;left:18px;bottom:18px;width:min(360px,calc(100vw - 36px));padding:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--solid) 94%,transparent),color-mix(in srgb,var(--solid2) 94%,transparent));border:1px solid rgba(255,79,163,.45);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.45);color:var(--text);font-family:var(--font);backdrop-filter:blur(16px)}
  #paGuide.hide{display:none}#paGuide h2{font-size:20px;margin:4px 0 6px}#paGuide p{font-size:13.5px;color:var(--muted);margin:0 0 10px}
  .pa-kicker{font-size:10.5px;letter-spacing:.1em;color:var(--pink);font-weight:800}
  .pa-actions{display:flex;gap:8px;margin-top:8px}.pa-actions button{flex:1;padding:9px;border:1px solid var(--line2);border-radius:12px;background:var(--surface2);color:var(--text);font:700 12.5px var(--font);cursor:pointer}
  .pa-actions button.pa-pri{background:var(--grad);border:0;color:#fff}.pa-actions button:disabled{opacity:.45;cursor:default}
  .pa-live{margin-top:10px;font-size:12.5px}.pa-live summary{cursor:pointer;font-weight:700;color:var(--muted)}
  .pa-lb{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:8px}.pa-lb select,.pa-lb input{display:block;width:100%;margin-top:4px;padding:7px;border-radius:10px;background:var(--surface);color:var(--text);border:1px solid var(--line2);font:12px var(--font)}
  .paGuideSpotlight{position:relative;z-index:31;outline:3px solid var(--pink)!important;outline-offset:6px;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,4,30,.55),0 0 30px rgba(255,79,163,.7)!important}
  #paGuideLog{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);max-height:80px;overflow:auto;font-size:11px;color:var(--muted)}#paGuideLog:empty{display:none}
  #paGuideClose{position:absolute;right:12px;top:10px;border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}
  @media (max-width:860px){#paGuide{left:10px;right:10px;width:auto;bottom:84px;max-height:calc(100vh - 120px);overflow:auto}}`;
  document.head.append(style); document.body.append(ui);

  const render = () => {
    const s = steps[i]; clearSpot(); renderView(s.view);
    q('#paGuideStep').textContent = `${i + 1} / ${steps.length}`;
    q('#paGuideTitle').textContent = s.title; q('#paGuideText').textContent = s.text;
    q('#paGuideBack').disabled = i === 0;
    q('#paGuideNext').textContent = i === steps.length - 1 ? 'Finalizar ✓' : 'Siguiente →';
    setTimeout(() => { const f = q(s.sel); if (f && !ui.classList.contains('hide')) { f.classList.add('paGuideSpotlight'); f.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }, 80);
  };
  const open = () => { if (!S.me) { toast('Primero completá tu perfil para entrar al planeta 🪐'); return; } $('#hostPanel').classList.remove('open'); ui.classList.remove('hide'); i = 0; render(); };
  const close = () => { ui.classList.add('hide'); clearSpot(); try { ws && ws.close(); } catch (e) { } };

  /* ---- Gemini Live: audio PCM 24 kHz ---- */
  const playPcm = b64 => {
    const bin = atob(b64); const len = bin.length - (bin.length % 2);
    const bytes = new Uint8Array(len); for (let n = 0; n < len; n++) bytes[n] = bin.charCodeAt(n);
    const pcm = new Int16Array(bytes.buffer);
    const buf = audioCtx.createBuffer(1, pcm.length, 24000), out = buf.getChannelData(0);
    for (let n = 0; n < pcm.length; n++) out[n] = pcm[n] / 32768;
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(audioCtx.destination);
    audioAt = Math.max(audioAt, audioCtx.currentTime); src.start(audioAt); audioAt += buf.duration;
  };
  const explainLive = () => {
    if (liveBusy) return;
    const key = (q('#paGuideApiKey').value.trim() || KEYS.gemini || '').trim();
    if (!key) { log('Cargá una clave de Gemini en ⚙️ Motor IA o en este formulario.'); return; }
    // El AudioContext se crea dentro del clic para que el navegador permita reproducir
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    audioCtx.resume(); audioAt = 0;
    liveBusy = true; const btn = q('#paGuideGemini'); btn.disabled = true; btn.textContent = 'Conectando…';
    const s = steps[i], voice = q('#paGuideLiveVoice').value; let spoke = false;
    const done = () => { liveBusy = false; btn.disabled = false; btn.textContent = '✨ Explicar este paso'; q('#paGuideApiKey').value = ''; };
    try {
      ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`);
    } catch (e) { log('No se pudo abrir la conexión: ' + e.message); done(); return; }
    ws.onopen = () => ws.send(JSON.stringify({ setup: {
      model: 'models/' + LIVE_MODEL,
      generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } } },
      systemInstruction: { parts: [{ text: 'Sos una guía educativa cálida de Planeta Azul, una microred universitaria. Hablá en español rioplatense, con frases cortas y tono cercano y juvenil. Explicá sin jerga. No menciones que sos un modelo.' }] }
    } }));
    ws.onmessage = async ev => {
      // Gemini Live envía los mensajes como Blob binario: hay que leerlos como texto
      const raw = typeof ev.data === 'string' ? ev.data : await (ev.data.text ? ev.data.text() : new Response(ev.data).text());
      let m; try { m = JSON.parse(raw); } catch (e) { return; }
      if (m.setupComplete) {
        btn.textContent = '🔊 Hablando…';
        ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: `Explicá este paso de la aplicación en hasta 80 palabras, con lenguaje cotidiano. Paso: ${s.title}. Contexto: ${s.text}` }] }], turnComplete: true } }));
        return;
      }
      (m.serverContent?.modelTurn?.parts || []).forEach(p => { if (p.inlineData?.data) { spoke = true; playPcm(p.inlineData.data); } });
      if (m.serverContent?.turnComplete) { log(`Gemini Live explicó "${s.title}" con la voz ${voice}.`); ws.close(); }
    };
    ws.onerror = () => log('Gemini Live no respondió (revisá la clave o la disponibilidad del modelo).');
    ws.onclose = e => { if (!spoke && e.code !== 1000) log(`Conexión cerrada (${e.code}) ${e.reason || ''}`.trim()); done(); };
  };

  /* ---- Demo automática: una estudiante ficticia interactúa ---- */
  const demo = () => {
    if (running) return; running = true; const b = q('#paGuideDemo'); b.disabled = true;
    i = 0; render(); log('Demo: se simula una estudiante interactuando con la red.');
    const at = (ms, f) => setTimeout(f, ms);
    at(1500, () => {
      const p = S.posts.find(x => !x.hidden && x.kind === 'pregunta') || S.posts[0];
      if (p && !p.reactions.duda.includes('me')) { p.reactions.duda.push('me'); emit('react', 'me', { kind: 'duda', title: p.title, tags: p.tags, materia: p.level === 'mat' ? p.scope : null }); refreshPost(p.id); log(`Marcó "Tengo duda" en: ${p.title}`); }
    });
    at(3500, async () => { hostOpen('nova'); await hostAsk('Soy nueva. ¿Dónde encuentro un recurso para preparar la primera entrega?'); log('Un anfitrión respondió una consulta contextual.'); });
    at(8000, async () => { $('#hostPanel').classList.remove('open'); i = 6; render(); await twinAct(); if (S.ui.view === 'gemelos') renderView('gemelos'); log('Un gemelo actuó a partir de señales de la red.'); });
    at(12000, async () => { i = 8; render(); await directorCycle(); log('El Director revisó la evidencia y actualizó el Núcleo.'); running = false; b.disabled = false; });
  };

  q('#paGuideOpen').onclick = () => ui.classList.contains('hide') ? open() : close();
  q('#paGuideClose').onclick = close;
  q('#paGuideGemini').onclick = explainLive;
  q('#paGuideDemo').onclick = demo;
  q('#paGuideBack').onclick = () => { if (i) { i--; render(); } };
  q('#paGuideNext').onclick = () => { if (i < steps.length - 1) { i++; render(); } else { close(); toast('🎓 Recorrido finalizado: explorá libremente'); } };
  // Si la persona navega por su cuenta, se quita el resaltado
  document.addEventListener('click', e => { if (e.target.closest('[data-act="nav"]') && !ui.contains(e.target)) clearSpot(); }, true);
})();
</script>
